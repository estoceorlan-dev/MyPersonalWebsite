<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=oe" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f6" />
    <script>
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("portfolio-theme");
        } catch {}
        const theme =
          saved === "light" || saved === "dark"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#0b0d12" : "#faf9f6";
      })();
    </script>
    <title>__PORTFOLIO_TITLE__</title>
    <meta name="description" content="__PORTFOLIO_DESCRIPTION__" />
    <meta property="og:title" content="__PORTFOLIO_TITLE__" />
    <meta property="og:description" content="__PORTFOLIO_DESCRIPTION__" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    __PORTFOLIO_SOCIAL_META__
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
